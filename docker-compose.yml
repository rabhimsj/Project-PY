version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: campusmind-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusmind}
      POSTGRES_USER: ${POSTGRES_USER:-campusmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusmind} -d ${POSTGRES_DB:-campusmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusmind-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusmind-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://campusmind:campusmind@db:5432/campusmind}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusmind-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
